name: Update Phigros Wiki data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape Phigros Wiki
        run: node scripts/scrape-wiki.mjs

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add songs.json

          if git diff --cached --quiet; then
            echo "No Wiki data changes."
          else
            git commit -m "Update Phigros Wiki song data"
            git push
          fi